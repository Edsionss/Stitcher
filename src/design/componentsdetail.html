<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Low-Code Platform</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b8cee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex h-screen w-full flex-col overflow-hidden">
<header class="flex flex-shrink-0 items-center justify-between gap-2 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-[#15202B] px-4 py-2">
<div class="flex items-center gap-2 flex-1">
<button class="p-2 text-slate-600 dark:text-slate-400 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
<span class="material-symbols-outlined">undo</span>
</button>
<button class="p-2 text-slate-600 dark:text-slate-400 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
<span class="material-symbols-outlined">redo</span>
</button>
</div>
<div class="flex flex-1 justify-center">
<div class="flex items-center gap-1 rounded-lg bg-slate-100 dark:bg-slate-800 p-0.5">
<button class="rounded-md bg-white dark:bg-slate-700 p-1.5 text-primary shadow-sm">
<span class="material-symbols-outlined">desktop_windows</span>
</button>
<button class="p-1.5 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white">
<span class="material-symbols-outlined">tablet_mac</span>
</button>
<button class="p-1.5 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white">
<span class="material-symbols-outlined">smartphone</span>
</button>
</div>
</div>
<div class="flex items-center gap-2 flex-1 justify-end">
<button class="flex h-7 cursor-pointer items-center justify-center overflow-hidden rounded-md bg-slate-100 dark:bg-slate-800 px-2.5 py-1.5 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700">
<span class="material-symbols-outlined mr-1.5 text-base">save</span>
<span>Save</span>
</button>
<button class="flex h-7 cursor-pointer items-center justify-center overflow-hidden rounded-md bg-slate-100 dark:bg-slate-800 px-2.5 py-1.5 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700">
<span class="material-symbols-outlined mr-1.5 text-base">visibility</span>
<span>Preview</span>
</button>
<button class="flex h-7 cursor-pointer items-center justify-center overflow-hidden rounded-md bg-primary px-2.5 py-1.5 text-xs font-medium text-white hover:bg-primary/90">
<span class="material-symbols-outlined mr-1.5 text-base">publish</span>
<span>Publish</span>
</button>
</div>
</header>
<div class="flex h-full grow flex-row overflow-y-auto">
<aside class="flex h-full w-64 flex-shrink-0 flex-col border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-[#15202B]">
<div class="flex flex-col gap-2 p-2">
<div class="flex items-center justify-between p-2">
<h2 class="text-base font-semibold text-slate-900 dark:text-white">Components</h2>
<button class="p-1.5 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-md">
<span class="material-symbols-outlined text-xl">unfold_less</span>
</button>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500">search</span>
<input class="w-full rounded-md border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 py-2 pl-9 pr-3 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary" placeholder="Search components..." type="text"/>
</div>
</div>
<div class="flex-1 overflow-y-auto p-2">
<div class="flex flex-col gap-1">
<div>
<button class="flex w-full items-center justify-between rounded-md p-2 text-left text-sm font-medium text-slate-900 dark:text-white hover:bg-slate-100 dark:hover:bg-slate-800">
<span>基础组件</span>
<span class="material-symbols-outlined text-lg">expand_more</span>
</button>
<div class="grid grid-cols-2 gap-2 p-2">
<div class="group flex cursor-grab flex-col items-center gap-2 rounded-lg border border-slate-200 dark:border-slate-800 p-3 hover:border-primary hover:bg-primary/5 dark:hover:bg-primary/10">
<span class="material-symbols-outlined text-2xl text-slate-600 dark:text-slate-400 group-hover:text-primary">smart_button</span>
<span class="text-xs text-slate-700 dark:text-slate-300 group-hover:text-primary">按钮</span>
</div>
<div class="group flex cursor-grab flex-col items-center gap-2 rounded-lg border border-slate-200 dark:border-slate-800 p-3 hover:border-primary hover:bg-primary/5 dark:hover:bg-primary/10">
<span class="material-symbols-outlined text-2xl text-slate-600 dark:text-slate-400 group-hover:text-primary">input</span>
<span class="text-xs text-slate-700 dark:text-slate-300 group-hover:text-primary">输入框</span>
</div>
<div class="group flex cursor-grab flex-col items-center gap-2 rounded-lg border border-slate-200 dark:border-slate-800 p-3 hover:border-primary hover:bg-primary/5 dark:hover:bg-primary/10">
<span class="material-symbols-outlined text-2xl text-slate-600 dark:text-slate-400 group-hover:text-primary">title</span>
<span class="text-xs text-slate-700 dark:text-slate-300 group-hover:text-primary">文本</span>
</div>
<div class="group flex cursor-grab flex-col items-center gap-2 rounded-lg border border-slate-200 dark:border-slate-800 p-3 hover:border-primary hover:bg-primary/5 dark:hover:bg-primary/10">
<span class="material-symbols-outlined text-2xl text-slate-600 dark:text-slate-400 group-hover:text-primary">image</span>
<span class="text-xs text-slate-700 dark:text-slate-300 group-hover:text-primary">图片</span>
</div>
</div>
</div>
<div>
<button class="flex w-full items-center justify-between rounded-md p-2 text-left text-sm font-medium text-slate-900 dark:text-white hover:bg-slate-100 dark:hover:bg-slate-800">
<span>表单组件</span>
<span class="material-symbols-outlined text-lg">expand_less</span>
</button>
</div>
<div>
<button class="flex w-full items-center justify-between rounded-md p-2 text-left text-sm font-medium text-slate-900 dark:text-white hover:bg-slate-100 dark:hover:bg-slate-800">
<span>数据展示</span>
<span class="material-symbols-outlined text-lg">expand_less</span>
</button>
</div>
<div>
<button class="flex w-full items-center justify-between rounded-md p-2 text-left text-sm font-medium text-slate-900 dark:text-white hover:bg-slate-100 dark:hover:bg-slate-800">
<span>布局组件</span>
<span class="material-symbols-outlined text-lg">expand_less</span>
</button>
</div>
</div>
</div>
</aside>
<main class="flex h-full flex-1 flex-col overflow-auto bg-background-light dark:bg-background-dark">
<div class="p-4 lg:p-6">
<div class="flex h-full w-full flex-col">
<div class="flex h-full flex-col items-center justify-center gap-6 rounded-lg border-2 border-dashed border-slate-300 dark:border-slate-700 bg-white dark:bg-[#15202B]/50 p-6 min-h-[calc(100vh-10rem)]">
<div class="flex max-w-[480px] flex-col items-center gap-2">
<span class="material-symbols-outlined text-5xl text-primary">add_circle</span>
<p class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">Start building your application</p>
<p class="text-slate-600 dark:text-slate-400 text-sm font-normal leading-normal text-center">Drag and drop a component from the left panel to get started.</p>
</div>
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 text-sm font-bold leading-normal tracking-[0.015em] hover:bg-slate-200 dark:hover:bg-slate-700">
<span class="truncate">Browse Components</span>
</button>
</div>
</div>
</div>
</main>
<aside class="flex h-full w-80 flex-shrink-0 flex-col border-l border-slate-200 dark:border-slate-800 bg-white dark:bg-[#15202B]">
<div class="flex h-full flex-col">
<div class="border-b border-slate-200 dark:border-slate-800 px-2">
<nav aria-label="Tabs" class="-mb-px flex justify-center">
<a aria-current="page" class="flex-1 whitespace-nowrap border-b-2 border-primary px-1 py-3 text-center text-sm font-medium text-primary" href="#">属性</a>
<a class="flex-1 whitespace-nowrap border-b-2 border-transparent px-1 py-3 text-center text-sm font-medium text-slate-500 hover:border-slate-300 hover:text-slate-700 dark:text-slate-400 dark:hover:border-slate-700 dark:hover:text-slate-300" href="#">样式</a>
<a class="flex-1 whitespace-nowrap border-b-2 border-transparent px-1 py-3 text-center text-sm font-medium text-slate-500 hover:border-slate-300 hover:text-slate-700 dark:text-slate-400 dark:hover:border-slate-700 dark:hover:text-slate-300" href="#">事件</a>
<a class="flex-1 whitespace-nowrap border-b-2 border-transparent px-1 py-3 text-center text-sm font-medium text-slate-500 hover:border-slate-300 hover:text-slate-700 dark:text-slate-400 dark:hover:border-slate-700 dark:hover:text-slate-300" href="#">高级</a>
</nav>
</div>
<div class="flex-1 overflow-y-auto p-4">
<div class="flex flex-col gap-4">
<p class="text-sm font-medium text-slate-900 dark:text-white">No Component Selected</p>
<p class="text-sm text-slate-500 dark:text-slate-400">Select a component on the canvas to see its properties.</p>
</div>
</div>
</div>
</aside>
</div>
</div>
</body></html>
